# AI 評価セット。**手動起動のみ。かつ、いまは必ず落ちる。**
#
# ## 本体は「作らない」と決めた（2026-08-17 / ah-gzq）
#
# 生成された文章の正しさ・良さを機械で判定するテストは**作らない**。
# 質を判定するには結局 AI をもう一度呼ぶことになり、
# **判定する側が正しいかを確かめる手段が無いまま従量課金だけが発生する**。
# たたき台の段階では割に合わない。
# **未実装（やり忘れ）ではなく、意図的な対象外である。**
# 正本は docs/product/traceability.md の REQ-CI13。
#
# ## ではなぜこのファイルを消さずに残すのか
#
# 残しているのは**費用の見張り**（`quality-gates.config.mjs` の AI_EVAL_BUDGET と
# `scripts/ai-eval-budget.mjs`、テスト 6 件）で、これは判断を覆すときに要る。
# 見張りを先に作ってあるのは順序の問題で、問い合わせる仕組みを先に作ると
# 上限が無いまま 1 回目が走る。費用が出てから上限を足す設計にはしない。
# このワークフローは、その見張りの**呼び先の枠**として置いてある。
#
# ## 空のまま緑にしない
#
# `scripts/ai-eval.mjs --run` は 0 件・0 円で**成功しない。終了コード 1 で落ちる**。
# 押した人が「評価セットが通った」と受け取るのを防ぐためである。
# 中身の無い緑は、赤よりたちが悪い（無いものが、あることになる）。
# **落ちるのが正しい状態**なので、赤いこと自体を直そうとしないこと。
#
# 判断を覆すときは、REQ-CI13 → `scripts/ai-eval.mjs` の順に直す。
#
# なお、AI を**呼ばない**構造検証（`tests/evals/generation-eval-set.test.ts`。
# 51 ケースの定義が仕様項目を覆っているかを見る）は通常の検査として残してある。
# 無料で、仕様と実装のずれを実際に見つけている。
#
# 従量課金が発生しうるのはこのワークフローだけである
# （GitHub Actions の標準ランナーは public リポジトリでは無料・無制限）。
# 定期実行に載せない。載せた瞬間、誰も見ていない時間に費用が出続ける。
#
# 規範: docs/spec/11-CI-CD・品質ゲート仕様.md §8-4
name: AI 評価セット

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "本体は作らないと決めており、このジョブは必ず落ちます。それでも走らせるには RUN と入力"
        required: true
        default: ""

concurrency:
  # 二重起動は費用が二重になる。打ち切らず、後から来た方を待たせる。
  group: ai-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    name: AI 評価セット
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 確認文字列の検証
        if: inputs.confirm != 'RUN'
        run: |
          echo "::error::confirm に RUN と入力してください（費用が発生する操作です）"
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 見積りと実測の両方を出す。実測だけだと「思っていたより高かった」に気づけず、
      # 見積りだけだと「見積りどおりだったか」が分からない。
      #
      # いまは 0 件で終了コード 1 になる。**それが正しい状態**（上のコメント参照）。
      - name: 評価セットの実行（本体は対象外のため落ちる）
        run: node scripts/ai-eval.mjs --run

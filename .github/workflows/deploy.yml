# dev/main の対象環境へ、控え→migration適用→台帳/定義確認→公開を直列実行する。
# 同じ D1 を触る手動 migrate とは共有 concurrency で排他する。
# 本番承認、失敗時の診断、修復手順は次の規範に集約する。
# 規範: docs/spec/11-CI-CD・品質ゲート仕様.md / docs/product/ci-cd-guide.md
name: 公開

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # 同じ D1 を触る migrate.yml とも直列化する。途中の DB 操作・公開は打ち切らない。
  group: d1-${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: write # 本番へ公開できた版にタグを打つため
  actions: read # 前回の公開が適用の最中に終わっていないかを見るため

# **仕事を 2 つの器へ分けてある。** 1 つの job に入れていた日の事故が下にある。
#
# `inspect`（測る）はやり直せる。途中で止めてよい。所要は変更の大きさに比例して伸びる。
# `release`（出す）はやり直せない。途中で止めてはいけない。所要はほぼ一定。
#
# 2026-09-02、この 2 つが同じ 30 分の器に入っていた。PR #46 の合流で
# `検査一式` が 29 分 53 秒かかり、器を使い切ったところで打ち切られた。
# 控え・適用・公開・動作確認は**1 歩も踏み出さないまま skip** され、
# dev には配られていないのに run は「終わった」という顔をしていた。
#
# **時間切れそのものより危ないのは、逆に転んだときである。**
# 検査が 26 分で終われば、残り 4 分で控えを取り、適用が始まる。上限は
# `db:migrate:remote` の**最中に**発火しうる。控えは在るが「途中で止まった」と
# 告げるものは無く、次に来た人は台帳と実体がずれた D1 を引き継ぐ。
# `cancel-in-progress: false` はこれを防がない——あれが断るのは concurrency の
# 割り込みだけで、job の上限は同じ道を通らない。
#
# 器を分けると、上限は**それぞれの仕事の性質に合わせて**置ける。
# 測る側が伸びても、出す側の持ち時間は 1 秒も削られない。
# 落ちた場所も job の名前で分かるので、ログの末尾まで降りずに済む。
jobs:
  # 測る側。**`verify` という id を避けている。**`main` の保護設定が必須にしている
  # 検査の名前が `verify`（ci.yml の job id）で、ここに同じ id を置くと、
  # 表示名を外した誰かが 2 つ目の `verify` を報告させてしまう。
  inspect:
    name: 検査（公開の前に）
    runs-on: ubuntu-latest
    # ci.yml の広い門と**同じ検査の集合**を走らせるので、安全弁も同じ位置に置く。
    # 実測は準備 15 分 + 変異 15 分でちょうど 30 分に届く。正常に終わる仕事が
    # 触らない位置に置くのが安全弁の役目で、30 分はその内側だった。
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IS_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
      # 出し先の名前。`wrangler --env` と見張りの両方がこれ 1 つを読む。
      # 枝から出し先を導く式を各ステップへ書き写すと、片方だけ直す回が来る。
      D1_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # `pnpm run verify` の 2 段に変更範囲のミューテーションが入っている。
          # 既定の浅い取得では比較元のコミットが手元に無く、検査が走らないまま
          # 落ちる（2026-08-21 に main への push で実際に落ちた）。
          # `ci.yml` と同じく履歴ごと取る。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # **検査一式（8 分超）より前に、D1 へ届くかどうかだけ見ておく。**
      #
      # 未適用が「ある」ことはここでは落とさない（`report`）。このあとの自動適用が
      # まさにそれを直すステップで、ここで落とすとその手前で止まってしまう。
      #
      # ここで落ちるのは `unknown`——**測れなかったとき**である。
      # 資格情報が切れている、D1 に届かない、`wrangler` の出力の形が変わった。
      # どれも 30 秒で分かるのに、8 分待ってから受け取っていた（2026-08-24 の run #17）。
      # 「未適用が無い」と「測れなかった」を同じ緑にしないのが、このステップの仕事である。
      - name: データの形を見に行けるか（先に見る）
        env:
          PENDING_ACTION: report
        run: bash .github/scripts/require-migrations-applied.sh

      # PR で通っていても、ここでもう一度走らせる。
      # 枝へ直接 push された変更は PR の検査を通っていない。
      #
      # **比較元を渡さないと、既定の `origin/dev` が使われる。**
      # main の公開でそれを使うと「main にあって dev に無いもの全部」が対象になり、
      # 上限 25 件を超えて `mutation.mjs` が見送りに落ちる。落ちた先は exit 0 なので、
      # **測っていないのに緑**になる。ここは `fetch-depth` と対で効く。
      - name: 検査一式
        env:
          # push なら直前の枝の先端（この公開が持ち込んだ分だけを測る）。
          # 手動実行には `before` が無いので `HEAD^` へ落とす。**黙って測らない道は作らない**——
          # どちらも解決できなければ `mutation.mjs` が exit 1 で落ち、人の目に入る。
          MUTATION_BASE: ${{ github.event.before || 'HEAD^' }}
        run: pnpm run verify

  # 出す側。ここから先はやり直せない。**測り終えてから入る。**
  #
  # `needs` は順番の指定であると同時に関門でもある。`inspect` が赤でも
  # 時間切れでも、この job はそもそも始まらない。以前は同じ job の中で
  # 「前のステップが落ちたら後ろは走らない」に頼っていたが、その頼り方だと
  # 前半が持ち時間を食い潰した回に、後半が**走れなかったのか走って落ちたのか**が
  # run の見た目から区別できなかった。
  release:
    name: 公開
    needs: inspect
    runs-on: ubuntu-latest
    # 控え → 適用 → 公開 → 動作確認だけの持ち時間。実測はどれも分単位で、
    # 変更の大きさでは伸びない。**伸びない仕事にだけ、この器を使う。**
    timeout-minutes: 30
    # main のときだけ production。Environment に承認者を登録すると、
    # **マージしても人が承認するまで本番へ出ない**（このリポジトリは公開設定のため使える）。
    # 登録手順は docs/product/ci-cd-guide.md ⑤。
    #
    # 承認をこちら側の job に置いたことで、**人は検査が通ったのを見てから押す**。
    # 1 つの job だった頃は、押してから 30 分測って、その先で落ちることがあった。
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      url: ${{ github.ref == 'refs/heads/main' && vars.APP_URL || vars.PREVIEW_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IS_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
      D1_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 本番へ公開できた版にタグを打つ。浅い取得だと打つ先が無い。
          fetch-depth: 0

      # **控えは「戻れる」ことしか言わない。「戻るべきか」は別に見る必要がある。**
      #
      # 上限が適用の最中に発火すると、そこまでの変更は D1 に残るのに台帳には載らない。
      # 次の公開は「未適用がある」と見て同じ移行を頭から当て直し、
      # `duplicate column name` で落ちる（2026-08-24 の run #22）。落ちること自体は
      # 正しいが、**なぜ落ちたのかが run の見た目から分からない。**
      #
      # だからここで、前回が適用の最中に打ち切られていないかを先に見る。
      # 残っていれば自動では進まない。人が実際の形を確かめるまで待つ。
      - name: 前回の公開が途中で終わっていないか
        env:
          # `github.token` と同じ自動発行のトークンだが、こちらの書き方にする。
          # 見張り（REQ-CI07）は「秘密は `secrets.` から来ること」で平文の直書きを
          # 見分けている。同義でも別の綴りを通し始めると、その見分けが鈍る。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/require-previous-apply-complete.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ここから 3 ステップが「データの形を合わせる」本体で、**どちらの環境でも走る**。
      #
      # 以前は dev だけ自動、本番は `migrate.yml` の手動起動＋`APPLY` だった。
      # その非対称は 2 つのものを壊していた。
      #
      # ひとつは dev の失敗が作法になっていたこと。移行を含む変更は
      # **必ず一度公開が落ちてから、手で migrate を流して、公開を再実行する**しかなく、
      # 赤が「何かおかしい」の合図として働かなくなっていた（2026-08-24 の run #17）。
      #
      # もうひとつは、本番で人が踏む手順が**機械の踏む手順と違っていた**こと。
      # 手で流すとき、控えを取るかどうかは人の記憶に委ねられる。
      # 控えを取ることが規範なら、それを守らせるのは人の記憶ではなく順番のほうがよい。
      #
      # 本番で人が立つ場所は、この並びの手前——`environment: production` の承認である。
      - name: 適用前のバックアップ
        run: |
          mkdir -p backup
          backup_path="backup/${D1_ENV}-$(date -u +%Y%m%dT%H%M%SZ).sql"
          pnpm exec wrangler d1 export DB --env "$D1_ENV" --remote --output "$backup_path"
          # 中身が空でないことを確かめる。`wrangler` が 0 で終わっても、
          # 中身の無いファイルだけ残る場合がある。それを控えと呼ばない。
          # **ここが本番自動適用の支点である。** 控えが取れないなら適用へ進まない。
          # `test -s` と書かないのは、この語が検査名 `test` の書き写しとして
          # 見張りに拾われるためで、意味は `[ -s ... ]` と同じである。
          if [ ! -s "$backup_path" ]; then
            echo "::error::控えが空です（$backup_path）。適用を中止します。"
            exit 1
          fi
          ls -la backup

      # 落ちても中身が残るように、適用より先に保存する（migrate.yml と同じ順番）。
      - name: バックアップを保管する
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ env.D1_ENV }}-${{ github.run_number }}
          path: backup/
          if-no-files-found: error
          retention-days: 30

      # 未適用が無ければ wrangler が何もせずに終わるので、条件で囲まなくてよい。
      #
      # **job の上限（30 分）より先に、ここで切る。**
      # job の上限が発火すると、走っていたステップは道半ばのまま run ごと畳まれ、
      # 「どこで終わったか」が残らない。ステップに上限を置いておけば、
      # 切れたときこのステップが `cancelled` として run に**確定して残る**。
      # 上の「前回の公開が途中で終わっていないか」が次の回にそれを読む。
      #
      # 10 分は実測（数十秒）から見て十分に広い。正常に終わる適用は触らない。
      - name: データの形を合わせる
        timeout-minutes: 10
        run: pnpm run db:migrate:remote --env "$D1_ENV"

      # 順番（データの形の変更 → 公開）が守られたかを、人の記憶ではなく機械が見る。
      #
      # これは上の自動適用が**本当に効いたか**の答え合わせである。
      # 「適用を実行した」ではなく「未適用が 0 件になった」を見る。
      # 適用が黙って空振りしていたら、ここで気づける。
      #
      # **どちらの環境でも未適用が残っていれば落ちる。** 落ちたときは公開へ進まない。
      # 新しいコードが存在しない列を読む状態を作らないための、最後の関門である。
      - name: データの形が追いついているか（公開の直前）
        env:
          PENDING_ACTION: fail
        run: bash .github/scripts/require-migrations-applied.sh

      # 台帳だけでなく sqlite_master の定義も確認する。詳細と修復手順は CI/CD 仕様が正本。
      - name: データの形が移行ファイルと同じか（公開の直前）
        run: pnpm run db:drift

      - name: 公開
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            pnpm deploy:prod
          else
            pnpm deploy:dev
          fi

      # 「公開できた」はファイルが届いたことしか意味しない。実際に動いているかは別。
      # Cloudflare Workers は古い実行環境を数十秒〜1〜2 分残すため、
      # 1 回だけの確認では「直っているのに直っていない」「壊れているのに大丈夫」の
      # どちらにも誤判定する。間隔を空けて 2 回見る。
      - name: 動作確認（間隔を空けて 2 回）
        env:
          APP_URL: ${{ github.ref == 'refs/heads/main' && vars.APP_URL || vars.PREVIEW_URL }}
        run: bash .github/scripts/smoke.sh

      # 戻す先の目印。「1 つ前に戻す」はここを指して行う。
      - name: 公開できた版に印を付ける
        if: env.IS_PRODUCTION == 'true'
        run: |
          TAG="v${{ github.run_number }}"
          git tag "$TAG"
          git push origin "$TAG"
          {
            echo "### 本番へ公開しました: \`$TAG\`"
            echo ""
            echo "戻すときは \`wrangler rollback\`、または 1 つ前のタグから公開し直します。"
          } >> "$GITHUB_STEP_SUMMARY"

# 公開する。壊せるのは**アプリ**（データではない）。
#
# 出す先は枝で決まる:
#   dev  へ push  → 試し場（preview 環境）。ここで人が触って確かめる
#   main へ push  → 本番。承認を経てから出る
#
# 順番は常に「データの形の変更 → 公開」。
# 逆にすると、新しいコードが存在しない列を読んで本番が全面エラーになる。
# その順番は `.github/scripts/require-migrations-applied.sh` が公開の直前に見張る。
#
# **その順番の守らせ方が、出し先で違う。**
#   本番 … ここでデータの形は変えない。`migrate.yml` の手動起動＋`APPLY` で先に済ませる。
#          未適用が残っていれば公開が止まる。戻せないものの前には人を立たせる。
#   dev  … バックアップを取ったうえで、公開の直前に**自動で**適用する。
#          手動を求めていた頃は、移行を含む変更が必ず一度落ちてから手で流す作法になり、
#          赤が「何かおかしい」の合図として働かなくなっていた。
#          dev は人が触って確かめるための場で、壊れても作り直せる。
#
# 手元から `wrangler deploy` を打たない理由:
# wrangler は git のコミットではなく**その場の作業ツリー**をビルドする。
# 未コミットの実験コードが本番へ混ざり得る。CI は毎回まっさらな取得なので、
# この事故が構造的に起きない。これが自動化する最大の理由で、時短ではない。
#
# 規範: docs/spec/11-CI-CD・品質ゲート仕様.md / docs/product/ci-cd-guide.md
name: 公開

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # 公開は打ち切らない。途中で止めると、どの版が出ているか分からなくなる。
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 本番へ公開できた版にタグを打つため

jobs:
  deploy:
    name: 公開
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # main のときだけ production。Environment に承認者を登録すると、
    # **マージしても人が承認するまで本番へ出ない**（このリポジトリは公開設定のため使える）。
    # 登録手順は docs/product/ci-cd-guide.md ⑤。
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      url: ${{ github.ref == 'refs/heads/main' && vars.APP_URL || vars.PREVIEW_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IS_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # `pnpm run verify` の 2 段に変更範囲のミューテーションが入っている。
          # 既定の浅い取得では比較元のコミットが手元に無く、検査が走らないまま
          # 落ちる（2026-08-21 に main への push で実際に落ちた）。
          # `ci.yml` と同じく履歴ごと取る。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # **本番だけ、検査一式より前に見る。**
      # 未適用が残っているかは 30 秒で分かるのに、これを `pnpm run verify`（8 分超）の
      # 後ろに置いていたせいで、答えの出ている失敗を 8 分待ってから受け取っていた
      # （2026-08-24 の run #17）。安い判定を高い判定の前へ出す。
      #
      # dev は落とさない（`report`）。このあとの自動適用がまさにそれを直すステップで、
      # ここで落とすとその手前で止まってしまう。
      # **どちらの設定でも `unknown`（測れなかった）は落ちる。**
      - name: データの形が追いついているか（先に見る）
        env:
          D1_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
          PENDING_ACTION: ${{ github.ref == 'refs/heads/main' && 'fail' || 'report' }}
        run: bash .github/scripts/require-migrations-applied.sh

      # PR で通っていても、ここでもう一度走らせる。
      # 枝へ直接 push された変更は PR の検査を通っていない。
      #
      # **比較元を渡さないと、既定の `origin/dev` が使われる。**
      # main の公開でそれを使うと「main にあって dev に無いもの全部」が対象になり、
      # 上限 25 件を超えて `mutation.mjs` が見送りに落ちる。落ちた先は exit 0 なので、
      # **測っていないのに緑**になる。ここは `fetch-depth` と対で効く。
      - name: 検査一式
        env:
          # push なら直前の枝の先端（この公開が持ち込んだ分だけを測る）。
          # 手動実行には `before` が無いので `HEAD^` へ落とす。**黙って測らない道は作らない**——
          # どちらも解決できなければ `mutation.mjs` が exit 1 で落ち、人の目に入る。
          MUTATION_BASE: ${{ github.event.before || 'HEAD^' }}
        run: pnpm run verify

      # ここから下の 3 ステップは **dev のときだけ**動く。本番では 1 行も走らない。
      #
      # なぜ dev だけ自動にするか:
      # migrate は手動・deploy は自動という非対称のせいで、移行を含む変更は
      # **必ず一度公開が落ちてから、手で migrate を流して、公開を再実行する**しかなかった。
      # 失敗が作法になっている状態で、赤は「何かおかしい」の合図として働かなくなる。
      # dev は人が触って確かめるための場で、壊れても作り直せる。だからここは機械に任せる。
      #
      # **本番は今まで通り migrate.yml の手動起動＋`APPLY` のままである。**
      # 本番データは元に戻せない。戻せないものの前には人を立たせる。
      - name: 適用前のバックアップ（dev のみ）
        if: env.IS_PRODUCTION != 'true'
        run: |
          mkdir -p backup
          backup_path="backup/dev-$(date -u +%Y%m%dT%H%M%SZ).sql"
          pnpm exec wrangler d1 export DB --env dev --remote --output "$backup_path"
          # 中身が空でないことを確かめる。`wrangler` が 0 で終わっても、
          # 中身の無いファイルだけ残る場合がある。それを控えと呼ばない。
          # `test -s` と書かないのは、この語が検査名 `test` の書き写しとして
          # 見張りに拾われるためで、意味は `[ -s ... ]` と同じである。
          if [ ! -s "$backup_path" ]; then
            echo "::error::控えが空です（$backup_path）。適用を中止します。"
            exit 1
          fi
          ls -la backup

      # 落ちても中身が残るように、適用より先に保存する（migrate.yml と同じ順番）。
      - name: バックアップを保管する（dev のみ）
        if: env.IS_PRODUCTION != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-dev-${{ github.run_number }}
          path: backup/
          if-no-files-found: error
          retention-days: 30

      # 未適用が無ければ wrangler が何もせずに終わるので、条件で囲まなくてよい。
      - name: データの形を合わせる（dev のみ）
        if: env.IS_PRODUCTION != 'true'
        run: pnpm db:migrate:dev

      # 順番（データの形の変更 → 公開）が守られたかを、人の記憶ではなく機械が見る。
      #
      # 本番ではこれが唯一の関門で、未適用が残っていればここで止まる。
      # 止まったら migrate.yml を先に流して、この公開を再実行する
      # （作り直したコミットは要らない）。
      #
      # dev では上の自動適用が**本当に効いたか**の答え合わせになる。
      # 「適用を実行した」ではなく「未適用が 0 件になった」を見る。
      # 適用が黙って空振りしていたら、ここで気づける。
      - name: データの形が追いついているか（公開の直前）
        env:
          D1_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
          PENDING_ACTION: fail
        run: bash .github/scripts/require-migrations-applied.sh

      - name: 公開
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            pnpm deploy:prod
          else
            pnpm deploy:dev
          fi

      # 「公開できた」はファイルが届いたことしか意味しない。実際に動いているかは別。
      # Cloudflare Workers は古い実行環境を数十秒〜1〜2 分残すため、
      # 1 回だけの確認では「直っているのに直っていない」「壊れているのに大丈夫」の
      # どちらにも誤判定する。間隔を空けて 2 回見る。
      - name: 動作確認（間隔を空けて 2 回）
        env:
          APP_URL: ${{ github.ref == 'refs/heads/main' && vars.APP_URL || vars.PREVIEW_URL }}
        run: bash .github/scripts/smoke.sh

      # 戻す先の目印。「1 つ前に戻す」はここを指して行う。
      - name: 公開できた版に印を付ける
        if: env.IS_PRODUCTION == 'true'
        run: |
          TAG="v${{ github.run_number }}"
          git tag "$TAG"
          git push origin "$TAG"
          {
            echo "### 本番へ公開しました: \`$TAG\`"
            echo ""
            echo "戻すときは \`wrangler rollback\`、または 1 つ前のタグから公開し直します。"
          } >> "$GITHUB_STEP_SUMMARY"

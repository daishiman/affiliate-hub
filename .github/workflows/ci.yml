name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # LayoutProps などの型は next build が .next/types に生成するため、
      # typecheck は build のあとに走らせる必要がある
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # スキーマを変更したのに db:generate を忘れていないか検出する
      - name: マイグレーション未生成の検出
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::スキーマ変更に対するマイグレーションが未生成です。'pnpm db:generate' を実行してコミットしてください。"
            git status --porcelain drizzle
            exit 1
          fi

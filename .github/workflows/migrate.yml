# 公開と切り離して先に migration を適用・修復するときの手動経路。
# 通常の公開は deploy.yml が同じ安全手順を自動実行する。詳細は CI/CD 仕様が正本。
#
# 規範: docs/spec/11-CI-CD・品質ゲート仕様.md / docs/product/ci-cd-guide.md
name: データの形の変更

on:
  workflow_dispatch:
    inputs:
      environment:
        description: どの環境に適用しますか
        required: true
        default: dev
        type: choice
        options: [dev, production]
      confirm:
        description: 本番データの形を変えます。実行するには APPLY と入力してください
        required: true
        type: string

concurrency:
  # deploy.yml と同じ環境名を使い、同じ D1 への操作を直列化する。
  group: d1-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: マイグレーション適用（${{ inputs.environment }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ENV: ${{ inputs.environment }}

    steps:
      # 押し間違いで本番データの形が変わらないようにする最後の関門。
      - name: 確認文字列の検証
        if: inputs.confirm != 'APPLY'
        run: |
          echo "::error::confirm に APPLY と入力してください（入力値: '${{ inputs.confirm }}'）"
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 適用前に必ず中身を書き出す。適用してから「戻したい」と言われても戻せない。
      #
      # 指定しているのは D1 の名前ではなく**バインディング名 `DB`**。
      # package.json の db:migrate:* と同じ指定にしてある。ここだけ別の呼び方にすると、
      # 片方の環境でだけ「そんなデータベースは無い」で落ちる。
      - name: 適用前のバックアップ
        run: |
          mkdir -p backup
          backup_path="backup/${D1_ENV}-$(date -u +%Y%m%dT%H%M%SZ).sql"
          pnpm exec wrangler d1 export DB --env "$D1_ENV" --remote \
            --output "$backup_path"
          test -s "$backup_path"
          ls -la backup

      # 落ちても中身が残るように、適用より先に保存する。
      - name: バックアップを保管する
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ inputs.environment }}-${{ github.run_number }}
          path: backup/
          if-no-files-found: error
          retention-days: 30

      - name: 未適用の一覧（適用前）
        run: pnpm exec wrangler d1 migrations list DB --env "$D1_ENV" --remote

      - name: 適用
        run: pnpm run db:migrate:remote --env "$D1_ENV"

      # 「適用した」ではなく「未適用が 0 件になった」を確かめる。
      - name: 未適用の一覧（適用後）
        run: pnpm exec wrangler d1 migrations list DB --env "$D1_ENV" --remote

      # deploy.yml と同じ定義比較を通す。詳細と修復手順は CI/CD 仕様が正本。
      - name: データの形が移行ファイルと同じか
        run: pnpm run db:drift

      - name: 次にすること
        run: |
          {
            echo "### データの形を変えました（${{ inputs.environment }}）"
            echo ""
            echo "バックアップはこの実行の成果物 \`d1-backup-${{ inputs.environment }}-${{ github.run_number }}\` にあります（30 日間）。"
            echo ""
            if [ "$D1_ENV" = "production" ]; then
              echo "**次は main への反映です。** 本番の「公開」が走ります。"
            else
              echo "**次は dev への反映です。** 試し場の「公開」が走ります。"
            fi
            echo "順番は データの形の変更 → 公開 で固定です。逆にすると本番が落ちます。"
          } >> "$GITHUB_STEP_SUMMARY"

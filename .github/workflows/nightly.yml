# 深い門（3 段）。**マージは止めない**。
#
# 止めないのには理由がある。この門の赤がマージを止めると、
# 手が止まる人が出て、やがて「この検査を外す」判断に流れる。
# 外された検査は、落ちない検査より悪い（あると思われているのに無い）。
#
# 落ちたときにやることは 1 つ、**残課題として起票する**こと。
# 起票は `docs/product/nightly-triage.md` の手順で人が行う
# （bd への書き込みは正規経路だけを使うため、機械からは書かない）。
#
# 中身をここに書かない。何が 3 段かは `quality-gates.config.mjs` が決める。
#
# ## 定例をやめた（2026-08-18）
#
# 以前はここに `schedule: cron` があり、毎日 18:00 UTC に走っていた。
# **やめた。** 一緒に消したのは、公開／非公開を見て曜日を判定する「予算の門」と
# `PRIVATE_RUN_DOW` の 1 行である。あれは「どの曜日に走らせるか」を決めるための
# 仕掛けなので、定例が無くなれば守るものが無い。
# **動かないまま残る仕掛けは、あとから読む人に「まだ走っている」と読まれる。**
#
# **やめた理由は「重かったから」ではない。** 実測は 27 分 0 秒（2026-08-17・同時実行 4）で、
# 毎日走らせても収まる程度に軽かった。それでも定例は要らないと判断した。
# 3 段が答えるのは「いま公開してよいか」であって、「昨夜の時点でどうだったか」ではない。
# **誰も見ない緑が毎晩 1 つ増えるだけなら、それは記録であって門ではない。**
#
# ## **代わりに、打つ場面を人の手順として書く**
#
# 定例をやめると、この門は**誰も打たなければ一度も走らない検査**になる。
# `llm-live-proof.mjs --check` で一度踏んだ穴と同じ形である
# （コメントの中にだけ名前があって、打つ場面が書かれていなかった）。
# **場面を書かずに定例だけ外すのは、検査を消したのと同じ。**
#
# **打つ場面は次の 3 つ。すべて人が手で `workflow_dispatch` から起動する。**
#
#   1. **本番へ公開すると判断する日**（必須）。
#      `docs/product/open-doors.md` を見る回と**同じ回**に含める。
#      公開の判断に必要なものを 1 回で揃えるためで、別の日に分けると
#      「今日はどっちを見る日だったか」を覚えている人が要る。
#   2. domain / application の**テストを大きく足したり消したりした直後**。
#      3 段はテストがコードの書き換えに気づくかを見るので、
#      テストの側が動いた回にしか意味のある差が出ない。
#   3. **3 段に属するテストを新しく足した回**（いまは 0 件）。
#      足した本人が 1 度打つ。打たないと、`--tier 3` が 0 件のまま通っていた頃と
#      区別が付かない。
#
# 見積りと経緯は docs/product/ci-cd-guide.md §9。
# 規範: docs/spec/11-CI-CD・品質ゲート仕様.md §8
name: 深い門

on:
  # **定例は置かない**（上の理由）。人が打つときだけ走る。
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deep:
    name: 深い門（3 段）
    runs-on: ubuntu-latest
    # 目標は 40 分（実測 27 分 0 秒 / 2026-08-17・同時実行 4）。目標であって落とす条件ではないので、
    # 上限はその数倍に置く。ここは暴走したジョブを止めるためだけの値。
    # 非公開になるとランナーの CPU が半分になり所要時間は延びるため、余裕を残す。
    timeout-minutes: 180

    steps:
      - name: 開始時刻
        id: budget
        run: echo "started_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 段の印そのものは、どの段で走らせるときも先に見る。
      # 印が無いテストは 3 段からも漏れる。
      - name: 段の指定漏れ
        run: node scripts/tier-audit.mjs

      # 現況: 3 段に属するテストはまだ 0 件で、その場合は 0 件と表示して通る。
      # 中身（負荷 / 見た目の回帰）はこれから足す。
      # 「まだ無い」を「通った」と言い換えないために、件数を必ず出す。
      - name: 3 段のテスト
        run: node scripts/run-tests.mjs --tier 3

      # domain + application の全体に対して、コードをわざと書き換えて
      # テストが気づくかを見る。手元の実測で 20 分を超えるので 2 段には置けない。
      # 何を走らせるかはここに書かず、quality-gates.config.mjs の 3 段が決める。
      - name: 3 段の検査（全体ミューテーション）
        run: node scripts/verify.mjs --tier 3

      # 実測を残す。スコアは推移で見るもので、1 回の値だけでは
      # 良くなったのか悪くなったのかが分からない。
      - name: 実測の保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

      # 所要時間をその場で出す。
      #
      # **これはもう頻度の根拠ではない**（定例は無い）。
      # 残してあるのは、打った人が「次にいつ打つか」を考えるとき、
      # また 3 段の対象を増やすとき、1 回あたりの重さが要るからである。
      # 月あたりの見積りは出さない。走る回数が決まっていないので、掛ける数が無い。
      #
      # **ここで出るのは「深い門 1 ジョブ分」の実測である。**
      # 口座（利用者）全体の月間合計とその使用率を見るのは
      # `.github/workflows/actions-usage.yml`（判定は `scripts/actions-usage.mjs`）で、
      # 対象が違う。1 ジョブが軽くても口座全体では枠に当たり得るし、
      # 口座に余裕があっても 1 回 3 時間なら打つ回数の判断は別に要る。
      - name: 所要時間
        if: always()
        env:
          STARTED_AT: ${{ steps.budget.outputs.started_at }}
        run: |
          set -euo pipefail
          elapsed=$(( $(date -u +%s) - STARTED_AT ))
          minutes=$(( (elapsed + 59) / 60 ))   # GitHub の課金は分単位の切り上げ
          echo "今回の所要時間: ${elapsed} 秒（課金上は ${minutes} 分）"

          {
            echo "### 深い門の実測"
            echo ""
            echo "| | 値 |"
            echo "| --- | --- |"
            echo "| 今回の所要時間 | ${elapsed} 秒（課金上 ${minutes} 分） |"
            echo ""
            echo "定例はありません。次に打つ場面は \`.github/workflows/nightly.yml\` 冒頭の 3 つ。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 落ちたときの案内
        if: failure()
        run: |
          echo "::warning::深い門が落ちました。マージは止めませんが、残課題として起票してください。"
          echo "手順: docs/product/nightly-triage.md"
